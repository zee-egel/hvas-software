services:
  - type: web
    name: hvas-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SIMULATION_STATE_PATH
        value: /tmp/simulation_state.json
      - key: ORDER_ASSISTANT_STATE_PATH
        value: /tmp/order_assistant_state.json
